name: Release

on:
  push:
    tags: ['v*']

jobs:
  check-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI
        run: |
          for i in $(seq 1 30); do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA" --jq '.workflow_runs[] | select(.name=="CI") | .conclusion')
            if [ "$conclusion" = "success" ]; then
              echo "CI passed"
              exit 0
            elif [ "$conclusion" = "failure" ]; then
              echo "CI failed"
              exit 1
            fi
            echo "Waiting for CI... ($i/30)"
            sleep 10
          done
          echo "CI did not complete in time"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    needs: check-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Build
        run: make release
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
